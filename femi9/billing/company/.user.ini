; Local MAMP overrides — do not deploy to production
session.save_path = "/tmp"
; This portal's own session cookie name. .htaccess's php_value session.name
; is inert on this local FastCGI setup (confirmed 2026-09-28 — FastCGI
; ignores php_value from .htaccess entirely, mod_php-only), so this
; .user.ini is what actually isolates this portal's session locally. Kept
; alongside .htaccess's directive (harmless no-op here) in case production
; runs mod_php instead, where that one would be the one that matters.
session.name = "femi9_company_sess"
