services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: billing0femi9_billingapp
      APP_URL: http://localhost:8080
    volumes:
      # Whole repo lives on their disk — edits (host IDE or inside the
      # container) show up instantly, and `git` commands work normally
      # on the checkout since it's the same files.
      - .:/var/www/html
      # vendor/ is excluded from git and rebuilt by `composer install`
      # during the image build — keep it container-managed so a fresh
      # checkout without vendor/ doesn't break the bind mount above.
      - vendor_root:/var/www/html/vendor
      - vendor_femi9:/var/www/html/femi9/vendor
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing0femi9_billingapp
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
  vendor_root:
  vendor_femi9:
