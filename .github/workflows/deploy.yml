name: Publish Website to CPanel
on:
  push:
    branches:
      - main
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read

# This workflow deploys `main` to production, exactly as it is. It does NOT
# merge any other branch first.
#
# History: it used to `git merge origin/jd` into `main` on every push and
# deploy the result. Because it only ever merged jd -> main (never main -> jd),
# origin/jd steadily fell behind main. A later push to jd, branched from an
# old main, would then re-introduce pre-fix code on jd's side of the auto-
# merge and silently revert fixes that already lived on main (e.g. the
# inclusive-GST invoice-total fix). That's why fixes "worked for a day then
# came back" and why jd/main "merged randomly".
#
# New rule: jd is integrated by hand.
#   git checkout jd && git merge main    # jd first, so it can never fall behind
#   git checkout main && git merge jd    # then jd -> main
#   git push origin main jd              # push both together
# Pushing main triggers this deploy. Nothing auto-merges.
jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: FTP-Deploy-Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # .env files are untracked (they hold live secrets and can't be
          # committed — GitHub's push protection blocks that outright).
          # Without this exclude, FTP-Deploy-Action's sync-state diff sees
          # "file was in a past deploy, now absent from the checkout" and
          # DELETES it from the server to match — this is exactly what
          # wiped production's shared/.env on 2026-08-06. Excluding these
          # paths tells the action to never touch them, so production's
          # manually-maintained secrets survive every future deploy.
          exclude: |
            **/.env
            **/.env.*
            !**/.env.example
