name: Publish Website to CPanel
on:
  push:
    branches:
      - main
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  merge-jd:
    name: Auto-merge jd into main
    runs-on: ubuntu-latest
    outputs:
      conflict: ${{ steps.merge.outputs.conflict }}
      conflict_files: ${{ steps.merge.outputs.conflict_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch jd
        run: git fetch origin jd
      - name: Attempt merge
        id: merge
        run: |
          if git merge origin/jd --no-edit -m "Auto-merge jd into main"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U | tr '\n' ',')
            echo "conflict_files=$files" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Push merged main
        run: git push origin main

  open-conflict-issue:
    name: Notify on merge conflict
    needs: merge-jd
    if: failure() && needs.merge-jd.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ needs.merge-jd.outputs.conflict_files }}`.split(',').filter(Boolean);
            const fileList = files.length ? files.map(f => `- \`${f}\``).join('\n') : '(file list unavailable)';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ jd → main auto-merge conflict — deploy skipped',
              body: [
                `Auto-merging \`jd\` into \`main\` failed after the push by @${context.actor}.`,
                '',
                '**Deploy was skipped — production was NOT updated.**',
                '',
                'Conflicting files:',
                fileList,
                '',
                'Resolve manually:',
                '```',
                'git fetch origin',
                'git checkout main',
                'git merge origin/jd',
                '# resolve conflicts, then:',
                'git add <resolved files>',
                'git commit',
                'git push origin main',
                '```'
              ].join('\n'),
              assignees: [context.actor]
            })

  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    needs: merge-jd
    if: needs.merge-jd.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: FTP-Deploy-Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # .env files are untracked (they hold live secrets and can't be
          # committed — GitHub's push protection blocks that outright).
          # Without this exclude, FTP-Deploy-Action's sync-state diff sees
          # "file was in a past deploy, now absent from the checkout" and
          # DELETES it from the server to match — this is exactly what
          # wiped production's shared/.env on 2026-08-06. Excluding these
          # paths tells the action to never touch them, so production's
          # manually-maintained secrets survive every future deploy.
          exclude: |
            **/.env
            **/.env.*
            !**/.env.example
